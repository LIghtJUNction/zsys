name: CI
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features alloc
      - run: cargo test --locked --all-features
      - run: cargo test --locked --release --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      - name: Validate native Linux ABI
        if: runner.os == 'Linux'
        run: cc -std=c11 -Wall -Wextra -Werror scripts/check_linux_abi.c -o /tmp/zsys-abi && /tmp/zsys-abi
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
  portable-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, wasm32-unknown-unknown
      - run: cargo check --locked --no-default-features --target thumbv7em-none-eabi
      - run: cargo check --locked --no-default-features --features alloc --target wasm32-unknown-unknown
  distributions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['rust:bookworm', 'rust:alpine']
    steps:
      - uses: actions/checkout@v4
      - name: Test unprivileged against distro libc and kernel ABI
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work:ro" -w /work \
            -e CARGO_HOME=/tmp/cargo -e CARGO_TARGET_DIR=/tmp/target "$IMAGE" sh -c \
            'rustc -Vv && cc -std=c11 -Wall -Wextra -Werror scripts/check_linux_abi.c -o /tmp/abi && /tmp/abi && cargo test --locked --all-features'
  tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - run: python3 scripts/release.py check
      - run: cargo fmt --manifest-path benchmarks/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path benchmarks/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release --manifest-path benchmarks/Cargo.toml
      - run: cargo package --locked
      - name: Verify empty normal dependency graph
        run: |
          cargo tree --locked --edges normal
          python3 - <<'PYCODE'
          import json, subprocess
          data = json.loads(subprocess.check_output(['cargo','metadata','--locked','--no-deps','--format-version','1']))
          assert not data['packages'][0]['dependencies'], 'runtime dependency graph must stay empty'
          PYCODE
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Sustained live sampling with allocation and descriptor assertions
        env:
          ZSYS_SOAK_SECONDS: 60
        run: cargo test --locked --release --test process_resources -- --nocapture
