name: Offline development bundle
on:
  push:
    branches: ['work/**']
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve benchmark development dependencies
        run: cargo fetch --manifest-path benchmarks/Cargo.toml
      - name: Package tools without credentials or repository authentication
        run: |
          mkdir -p offline-bundle
          SYSROOT=$(rustc --print sysroot)
          tar -I 'zstd -T2 -3' -cf offline-bundle/toolchain.tar.zst -C "$SYSROOT" bin/cargo bin/rustc bin/rustdoc bin/rustfmt bin/clippy-driver bin/cargo-clippy lib
          tar -czf offline-bundle/registry-cache.tar.gz -C "$HOME/.cargo" registry/cache registry/index
          git archive HEAD | gzip -9 > offline-bundle/source.tar.gz
          cp benchmarks/Cargo.lock offline-bundle/benchmark-Cargo.lock
          rustc -Vv > offline-bundle/toolchain-version.txt
          sha256sum offline-bundle/* > offline-bundle/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: offline-development-${{ github.sha }}
          path: offline-bundle/
          compression-level: 0
          retention-days: 3
