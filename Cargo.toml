[package]
name = "zsys"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A low-overhead, incremental system information engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zsys"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "BENCHMARKS.md", "docs/API.md", "CHANGELOG.md", "LICENSE-*"]
keywords = ["system", "procfs", "monitoring", "performance"]
categories = ["os", "hardware-support"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[lib]
path = "src/lib.rs"

[[test]]
name = "process_resources"
harness = false
