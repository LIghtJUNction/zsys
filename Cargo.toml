[package]
name = "zsys"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A low-overhead, incremental system information engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LIghtJUNction/zsys"
readme = "README.md"
keywords = ["system", "procfs", "monitoring", "performance"]
categories = ["os", "hardware-support"]
include = ["src/**", "examples/**", "tests/**", "README.md", "BENCHMARKS.md", "CHANGELOG.md", "LICENSE-*", "docs/semantics.md", "docs/platforms.md", "Cargo.toml", "Cargo.lock"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]

[lib]
path = "src/lib.rs"
