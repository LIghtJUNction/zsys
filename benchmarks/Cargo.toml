[package]
name = "zsys-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
# Separate executable: allocator instrumentation must not contaminate latency runs.
allocation-counting = []

[workspace]

[dependencies]
zsys = { path = ".." }
sysinfo = { version = "=0.40.3", default-features = false, features = ["system", "network", "disk"] }

[profile.release]
lto = "thin"
codegen-units = 1
